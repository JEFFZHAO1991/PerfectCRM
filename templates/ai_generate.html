<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 文本生成 Demo</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        "Helvetica Neue", Arial, "PingFang SC", "Microsoft Yahei", sans-serif;
      background: #f3f4f6;
      color: #111827;
    }
    .page {
      min-height: 100vh;
      padding: 24px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .card {
      width: 100%;
      max-width: 760px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 12px 30px rgba(15, 23, 42, 0.12);
      padding: 24px 28px 28px;
    }
    .header {
      margin-bottom: 16px;
    }
    .title {
      margin: 0;
      font-size: 22px;
      font-weight: 600;
    }
    .subtitle {
      margin: 6px 0 0;
      font-size: 14px;
      color: #6b7280;
    }
    label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 6px;
    }
    textarea {
      width: 100%;
      min-height: 100px;
      resize: vertical;
      padding: 10px 12px;
      font-size: 14px;
      border-radius: 10px;
      border: 1px solid #d1d5db;
      outline: none;
      font-family: inherit;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    textarea:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 1px rgba(37, 99, 235, 0.25);
    }
    .actions {
      margin-top: 12px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    button {
      border: none;
      outline: none;
      padding: 8px 18px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      background: #2563eb;
      color: #fff;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.15s ease, transform 0.05s ease;
    }
    button:hover {
      background: #1d4ed8;
    }
    button:active {
      transform: translateY(1px);
    }
    button:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }
    .status {
      font-size: 13px;
      color: #6b7280;
    }
    .status.loading { color: #2563eb; }
    .status.error { color: #b91c1c; }
    .status.success { color: #059669; }

    .result-card {
      margin-top: 18px;
      padding: 14px 14px 12px;
      border-radius: 12px;
      background: #f9fafb;
      border: 1px solid #e5e7eb;
    }
    .result-title {
      margin: 0 0 6px;
      font-size: 14px;
      font-weight: 600;
    }
    pre {
      margin: 0;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
        "Liberation Mono", "Courier New", monospace;
      font-size: 13px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .hidden { display: none; }

    .footer {
      margin-top: 14px;
      font-size: 12px;
      color: #9ca3af;
      text-align: right;
    }
    a.link-home {
      font-size: 13px;
      text-decoration: none;
      color: #2563eb;
    }
    a.link-home:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="card">
      <div class="header">
        <h1 class="title">AI 文本生成 Demo</h1>
        <p class="subtitle">
          这是独立的 AI 页面，不会影响你原来的首页。输入提示词，调用后端的 /api/generate/ 接口。
        </p>
      </div>

      <form id="ai-form">
        <label for="prompt">提示词（prompt）</label>
        <textarea
          id="prompt"
          name="prompt"
          placeholder="例如：用一句话介绍一下人工智能"
          required
        ></textarea>

        <div class="actions">
          <button type="submit" id="submit-btn">生成</button>
          <span id="status" class="status">等待输入…</span>
        </div>
      </form>

      <div id="result-card" class="result-card hidden">
        <p class="result-title">AI 返回结果：</p>
        <pre id="result-text"></pre>
      </div>

      <div class="footer">
        <a href="/" class="link-home">返回网站首页</a>
        &nbsp;·&nbsp; 后端接口：/api/generate/
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById("ai-form");
    const promptInput = document.getElementById("prompt");
    const statusEl = document.getElementById("status");
    const resultCard = document.getElementById("result-card");
    const resultText = document.getElementById("result-text");
    const submitBtn = document.getElementById("submit-btn");

    form.addEventListener("submit", function (e) {
      e.preventDefault();

      const prompt = promptInput.value.trim();
      if (!prompt) {
        statusEl.textContent = "请输入提示词再提交。";
        statusEl.className = "status error";
        return;
      }

      // 设置“加载中”状态
      submitBtn.disabled = true;
      statusEl.textContent = "正在调用 AI 接口…";
      statusEl.className = "status loading";
      resultCard.classList.add("hidden");

      fetch("/api/generate/", {
        method: "POST",
        headers: {
          "Content-Type": "application/x-www-form-urlencoded",
        },
        body: "prompt=" + encodeURIComponent(prompt),
      })
        .then((response) => response.json())
        .then((data) => {
          submitBtn.disabled = false;
          if (data.text) {
            resultText.textContent = data.text;
            resultCard.classList.remove("hidden");
            statusEl.textContent = "生成完成 ✅";
            statusEl.className = "status success";
          } else {
            statusEl.textContent = "后端返回错误，详情见下方。";
            statusEl.className = "status error";
            resultText.textContent = JSON.stringify(data, null, 2);
            resultCard.classList.remove("hidden");
          }
        })
        .catch((error) => {
          submitBtn.disabled = false;
          statusEl.textContent = "请求失败：" + error;
          statusEl.className = "status error";
        });
    });
  </script>
</body>
</html>
